<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Civitas buildings</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2362d2a2%27/%3E%3Crect x=%273%27 y=%276%27 width=%274%27 height=%277%27 fill=%27%230e1116%27/%3E%3Crect x=%279%27 y=%273%27 width=%274%27 height=%2710%27 fill=%27%230e1116%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <style>
    :root {
      --bg: #0e1116; --panel: #151a22; --panel2: #1b212b; --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.14);
      --fg: #e6e9ef; --muted: #8a93a3; --accent: #62d2a2; --draft: #f0b54a;
      --mat: #23453b; --matline: #3a6858;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body { display: grid; grid-template-rows: 44px 1fr; overflow: hidden; }
    a { color: var(--accent); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    header { display: flex; align-items: center; gap: 16px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
    header .brand { font-weight: 600; color: var(--accent); letter-spacing: 0.02em; white-space: nowrap; }
    header .count { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    header .spacer { flex: 1; }
    .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; flex: none; }
    .seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: rgba(98,210,162,0.18); color: var(--fg); }
    .seg button[aria-pressed="false"] { color: var(--muted); }
    header a.back { white-space: nowrap; text-decoration: none; }

    main { display: grid; grid-template-columns: 340px 1fr 330px; min-height: 0; }
    #browse { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
    #filters { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .row .lbl { color: var(--muted); width: 64px; flex: none; }
    .chip { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.03); cursor: pointer; font-size: 12px; color: var(--muted); }
    .chip:hover { background: rgba(255,255,255,0.08); }
    .chip[aria-pressed="true"] { color: var(--fg); background: rgba(98,210,162,0.16); border-color: rgba(98,210,162,0.55); }
    label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; font-size: 12px; }
    #grid { overflow-y: auto; padding: 4px 12px 16px; flex: 1; }
    #grid h3 { font: 600 12px/1 "IBM Plex Sans", sans-serif; color: var(--muted); margin: 14px 0 6px; display: flex; gap: 8px; align-items: baseline; }
    #grid h3 b { color: var(--fg); font-weight: 600; font-size: 13px; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .thumb { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--mat); cursor: pointer; aspect-ratio: 1; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; display: block; }
    .thumb .tag { position: absolute; left: 4px; bottom: 3px; font-size: 10px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.8); font-variant-numeric: tabular-nums; }
    .thumb .dr { position: absolute; right: 4px; top: 3px; font-size: 10px; color: #1b1405; background: var(--draft); border-radius: 3px; padding: 0 4px; }
    .thumb .by { position: absolute; left: 4px; top: 3px; font-size: 10px; color: #dfe9ff; background: rgba(60, 90, 160, 0.85); border-radius: 3px; padding: 0 4px; }
    .thumb .mv { position: absolute; right: 4px; bottom: 3px; font-size: 10px; color: #0b2a1e; background: rgba(98, 210, 162, 0.85); border-radius: 3px; padding: 0 4px; }
    .pill.author { background: rgba(60, 90, 160, 0.35); }
    .authorsel { background: transparent; color: inherit; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 2px 6px; font: inherit; }
    .thumb[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .empty { color: var(--muted); padding: 20px 4px; line-height: 1.5; }

    #stage { position: relative; min-width: 0; min-height: 0; background: var(--mat); }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #view:active { cursor: grabbing; }
    #title { position: absolute; left: 20px; right: 20px; bottom: 18px; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,0.5); }
    #title .k { color: rgba(230,233,239,0.75); font-size: 13px; margin-bottom: 2px; }
    #title .n { font: 600 clamp(22px, 3.4vw, 40px)/1.05 "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; max-width: 22ch; }
    #stageTools { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    #stageTools .box { background: rgba(14,17,22,0.72); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
    #hour { width: 120px; accent-color: var(--accent); }
    #stageTools .seg { background: rgba(14,17,22,0.72); }
    #stageTools .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    #insideTools { position: absolute; top: 56px; right: 12px; left: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
    #insideTools[hidden] { display: none; }
    #insideTools .box { pointer-events: auto; background: rgba(14,17,22,0.72); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; max-width: 100%; }
    #insideTools .line { background: rgba(14,17,22,0.72); border-radius: 6px; padding: 4px 10px; color: var(--fg); }
    #insideTools .line:empty { display: none; }
    #insideTools .hint { color: rgba(230,233,239,0.6); font-size: 11px; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
    #stage.inside #view { cursor: crosshair; }
    #stage.inside #title .n { font-size: clamp(15px, 1.6vw, 20px); max-width: 40ch; }
    #stage.inside #stageTools .box.turn { display: none; }
    #hourVal { font-variant-numeric: tabular-nums; width: 40px; color: var(--muted); }

    #spec { overflow-y: auto; padding: 14px 16px 24px; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
    #spec h2 { font: 600 17px/1.25 "IBM Plex Sans", sans-serif; margin: 0 0 2px; }
    #spec .sub { color: var(--muted); margin-bottom: 12px; line-height: 1.45; }
    #spec h4 { font: 600 12px/1 "IBM Plex Sans", sans-serif; color: var(--muted); margin: 18px 0 8px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; line-height: 1.4; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    table.levels { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    table.levels th, table.levels td { padding: 4px 4px; text-align: right; border-bottom: 1px solid var(--line); }
    table.levels th:first-child, table.levels td:first-child { text-align: left; color: var(--muted); font-weight: 400; }
    table.levels thead th { color: var(--muted); font-weight: 500; }
    table.levels .on { color: var(--fg); background: rgba(98,210,162,0.10); }
    table.levels thead th.on { color: var(--accent); }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); font-size: 11px; margin: 0 4px 4px 0; }
    .pill.draft { border-color: var(--draft); color: var(--draft); }
    .pill.moving { border-color: rgba(98,210,162,0.55); color: var(--accent); }
    .tints { display: flex; flex-wrap: wrap; gap: 6px; }
    .tints button { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line2); cursor: pointer; padding: 0; }
    .tints button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
    .note { color: var(--muted); line-height: 1.5; margin-top: 8px; }
    #grid h2.lad { font: 600 13px/1.2 "IBM Plex Sans", sans-serif; margin: 18px 0 2px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--fg); display: flex; gap: 8px; align-items: baseline; }
    #grid h2.lad:first-child { border-top: 0; padding-top: 0; }
    #grid h2.lad span { color: var(--muted); font-weight: 400; font-size: 12px; }
    #grid h2.lad i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    #grid h3 .rung { color: var(--accent); font-variant-numeric: tabular-nums; }
    table.ladder { font-size: 11px; } table.ladder th, table.ladder td { padding: 3px 2px; white-space: nowrap; } table.ladder td:nth-child(2) { white-space: normal; }
    table.ladder tbody tr { cursor: pointer; }
    table.ladder tbody tr:hover td { color: var(--fg); background: rgba(255,255,255,0.04); }
    table.ladder td:nth-child(2) { text-align: left; }
    .blurb { line-height: 1.5; margin: 0 0 6px; }
    .howto { color: var(--muted); line-height: 1.5; margin: 0; }
    code { font-size: 12px; color: var(--fg); background: var(--panel2); padding: 0 4px; border-radius: 3px; }

    @media (max-width: 1100px) { main { grid-template-columns: 300px 1fr 300px; } }
    @media (max-width: 860px) {
      html, body { height: auto; }
      body { overflow: auto; grid-template-rows: auto auto; }
      #spec, #browse { overflow: visible; }
      header { flex-wrap: wrap; padding: 8px 16px; gap: 8px 12px; }
      header .spacer { display: none; }
      main { grid-template-columns: 1fr; }
      #stage { height: 56vh; order: 1; }
      #spec { order: 2; border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px; }
      #browse { order: 3; border-right: 0; border-top: 1px solid var(--line); }
      #filters, #grid { padding-left: 16px; padding-right: 16px; }
      #grid { overflow: visible; }
      .thumbs { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
      #stageTools { left: 12px; justify-content: flex-start; }
      #insideTools { top: 100px; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { #view { cursor: default; } }
  </style>
</head>
<body>
  <header>
    <span class="brand">civitas buildings</span>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <span class="seg" role="group" aria-label="Lighting">
      <button id="dayBtn" aria-pressed="true">Day</button><button id="nightBtn" aria-pressed="false">Night</button>
    </span>
    <a class="back" href="/compare.html">Compare models</a>
    <a class="back" href="/">Back to the city</a>
  </header>
  <main>
    <section id="browse" aria-label="Designs">
      <div id="filters">
        <div class="row" id="viewRow"><span class="lbl">Group by</span></div>
        <div class="row" id="famRow"><span class="lbl">Family</span></div>
        <div class="row" id="tierRow"><span class="lbl">Tech tier</span></div>
        <div class="row" id="tagRow"><span class="lbl">Tag</span></div>
        <div class="row" id="motionRow"><span class="lbl">Motion</span></div>
        <div class="row"><span class="lbl"></span><label class="check"><input type="checkbox" id="drafts" checked /> Include drafts</label></div>
        <div class="row"><span class="lbl">Designer</span><select id="author" class="authorsel"></select></div>
      </div>
      <div id="grid"></div>
    </section>
    <section id="stage" aria-label="Turntable preview">
      <canvas id="view"></canvas>
      <div id="stageTools">
        <span class="seg" role="group" aria-label="View"><button id="outsideBtn" aria-pressed="true">Outside</button><button id="insideBtn" aria-pressed="false">Inside</button></span>
        <div class="box"><label for="hour" style="color:var(--muted)">Hour</label><input type="range" id="hour" min="0" max="24" step="0.25" value="11" /><span id="hourVal"></span></div>
        <div class="box turn"><label class="check"><input type="checkbox" id="spin" checked /> Turn</label><label class="check"><input type="checkbox" id="site" /> Under construction</label><label class="check" title="Every size of this building's ladder side by side, smallest first"><input type="checkbox" id="lineup" /> Ladder line-up</label></div>
      </div>
      <div id="insideTools" hidden>
        <div class="box rooms"><span id="roomChips" class="row"></span><button id="visitBtn" class="chip" title="Another visitor, another seat, other people round them">Another visit</button></div>
        <div class="line" id="insideLine"></div>
        <div class="hint">Drag to look round · scroll to zoom</div>
      </div>
      <div id="title"><div class="k" id="titleKind"></div><div class="n" id="titleName"></div></div>
    </section>
    <aside id="spec" aria-label="Specification"></aside>
  </main>
  <script type="module" src="/src/viewer.ts"></script>
</body>
</html>
